name: Build iTerm2

on:
  push:
    branches: [fix/smart-activity-indicator]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Kill orphan Xcode processes
        run: |
          killall ibtoold 2>/dev/null || true
          killall AssetCatalogSimulatorAgent 2>/dev/null || true

      - name: Build Development
        run: |
          # 重试最多 3 次，处理 Xcode 26.2 的 ibtoold 崩溃问题
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt of 3"
            set +e
            make Development BUILD_DIR="$PWD/build" 2>&1 | tee build_output.txt
            exit_code=$?
            set -e
            echo "::endgroup::"

            if [ $exit_code -eq 0 ]; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi

            if grep -q "CompileAssetCatalogVariant failed\|IBPlatformToolFailureException\|The tool closed the connection" build_output.txt; then
              echo "::warning::Attempt $attempt failed due to flaky ibtoold crash"
              if [ $attempt -lt 3 ]; then
                echo "Retrying..."
                killall ibtoold 2>/dev/null || true
                killall AssetCatalogSimulatorAgent 2>/dev/null || true
                sleep 5
                continue
              else
                echo "::error::All 3 attempts failed"
                exit 1
              fi
            else
              echo "::error::Build failed (not a flaky ibtoold issue)"
              exit 1
            fi
          done

      - name: Package app
        run: |
          cd build/Development
          ditto -c -k --sequesterRsrc --keepParent iTerm2.app iTerm2.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iTerm2-Development
          path: build/Development/iTerm2.app.zip
          retention-days: 30
